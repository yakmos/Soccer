<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איפוס דירוגים – מעבר ל-5 מדדים</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body { font-family:'Heebo',sans-serif; background:#0F172A; color:#E2E8F0; margin:0; padding:20px; }
    .card { max-width:560px; margin:30px auto; background:#1E293B; border:1px solid #334155; border-radius:16px; padding:25px; }
    h1 { font-size:1.4rem; margin:0 0 6px; }
    .sub { color:#94A3B8; font-size:0.9rem; margin-bottom:20px; line-height:1.6; }
    label { display:block; font-weight:800; font-size:0.9rem; margin:14px 0 6px; }
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0F172A; color:#E2E8F0; font-family:'Heebo',sans-serif; font-size:1rem; }
    button { width:100%; padding:14px; border-radius:10px; border:none; font-family:'Heebo',sans-serif; font-weight:900; font-size:1.05rem; cursor:pointer; margin-top:20px; }
    .danger { background:#DC2626; color:#fff; }
    .danger:disabled { opacity:0.5; cursor:not-allowed; }
    .warn { background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.35); color:#FCA5A5; padding:12px; border-radius:10px; font-size:0.85rem; line-height:1.6; margin-top:16px; }
    #log { margin-top:20px; font-size:0.85rem; line-height:1.8; white-space:pre-wrap; background:#0F172A; border:1px solid #334155; border-radius:10px; padding:14px; max-height:320px; overflow:auto; display:none; }
    .ok { color:#10B981; } .err { color:#F87171; }
</style>
</head>
<body>
<div class="card">
    <h1>🔄 איפוס דירוגים</h1>
    <div class="sub">מעבר ממערכת 10 המדדים למערכת 5 המדדים החדשה.<br>הרץ פעם אחת בלבד, לפני שליחת קישורי ההצבעה החדשים.</div>

    <label>מזהה קבוצה (Group ID)</label>
    <input id="groupId" placeholder="לדוגמה: CBLYpMMYzyc9k9dDPOjC">

    <label>סיסמת מנהל</label>
    <input id="pwd" type="password" placeholder="הסיסמה של הקבוצה">

    <label>הקלד <b>אפס</b> לאישור</label>
    <input id="confirm" placeholder="אפס">

    <div class="warn">
        ⚠️ הפעולה תמחק את כל ההצבעות הקיימות ותאפס את כל המדדים ל-5.<br>
        אין דרך לבטל. הקישורים האישיים של המצביעים יישארו תקפים — רק ההצבעות עצמן נמחקות.
    </div>

    <button class="danger" id="btn" onclick="run()">אפס הכול 🗑️</button>
    <div id="log"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyABePxlQnnjbmFWIlzR91kuYZQkpVFuELY",
    authDomain: "soccer-b30a6.firebaseapp.com",
    projectId: "soccer-b30a6",
    storageBucket: "soccer-b30a6.firebasestorage.app",
    messagingSenderId: "295483280442",
    appId: "1:295483280442:web:0633390394600eb6357903"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(location.search);
if (params.get('group')) document.getElementById('groupId').value = params.get('group');

const logEl = document.getElementById('log');
function log(msg, cls) {
    logEl.style.display = 'block';
    logEl.innerHTML += `<div class="${cls||''}">${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}

// שדות שיימחקו מכרטיס השחקן: המדדים הישנים והסכומים שלהם
const OLD_KEYS = ['fin','dri','vis','pos','tac','awa','str','com'];
const ALL_SUM_KEYS = ['fin','dri','pac','vis','pos','tac','awa','str','sta','com','atk','def','pas'];
const NEW_KEYS = ['atk','def','sta','pac','pas'];
const DEL = firebase.firestore.FieldValue.delete();

async function run() {
    const groupId = document.getElementById('groupId').value.trim();
    const pwd     = document.getElementById('pwd').value;
    const confirm = document.getElementById('confirm').value.trim();
    const btn     = document.getElementById('btn');

    if (!groupId)            return alert('חסר מזהה קבוצה');
    if (confirm !== 'אפס')   return alert('הקלד "אפס" בשדה האישור');

    btn.disabled = true;
    btn.innerText = 'מאפס... ⏳';

    try {
        const groupRef = db.collection('groups').doc(groupId);
        const groupDoc = await groupRef.get();
        if (!groupDoc.exists) throw new Error('הקבוצה לא נמצאה');
        if (groupDoc.data().password !== pwd) throw new Error('סיסמת מנהל שגויה');
        log('✅ אימות מנהל עבר', 'ok');

        // ---- 1. איפוס כרטיסי השחקנים ----
        const playersSnap = await groupRef.collection('players').get();
        log(`נמצאו ${playersSnap.size} שחקנים`);

        let batch = db.batch(), ops = 0;
        for (const doc of playersSnap.docs) {
            const upd = { votesCount: 0, attScore: 5, defScore: 5, customStats: {}, customSums: {}, customAvgs: {} };
            NEW_KEYS.forEach(k => upd[k] = 5);
            OLD_KEYS.forEach(k => upd[k] = DEL);
            ALL_SUM_KEYS.forEach(k => upd['sum' + k.charAt(0).toUpperCase() + k.slice(1)] = DEL);
            upd.lockedParams = DEL;   // נעילות ישנות מתייחסות למדדים שלא קיימים יותר
            if (doc.data().isGk) { upd.attScore = doc.data().gkScore || 5; upd.defScore = doc.data().gkScore || 5; }
            batch.update(doc.ref, upd);
            if (++ops >= 400) { await batch.commit(); batch = db.batch(); ops = 0; }
        }
        if (ops) await batch.commit();
        log(`✅ ${playersSnap.size} כרטיסי שחקן אופסו`, 'ok');

        // ---- 2. מחיקת ההצבעות של כל המצביעים ----
        const votersSnap = await groupRef.collection('voters').get();
        log(`נמצאו ${votersSnap.size} מצביעים`);

        let deleted = 0;
        for (const voter of votersSnap.docs) {
            const votes = await voter.ref.collection('votes').get();
            let vb = db.batch(), vo = 0;
            for (const v of votes.docs) {
                vb.delete(v.ref);
                deleted++;
                if (++vo >= 400) { await vb.commit(); vb = db.batch(); vo = 0; }
            }
            if (vo) await vb.commit();
            await voter.ref.update({ votedCount: 0 });
        }
        log(`✅ ${deleted} הצבעות נמחקו, המונים אופסו`, 'ok');

        log('\n🎉 האיפוס הושלם. אפשר לשלוח את קישורי ההצבעה.', 'ok');
        btn.innerText = 'הושלם ✅';
    } catch (e) {
        console.error(e);
        log('❌ ' + (e.message || e), 'err');
        btn.disabled = false;
        btn.innerText = 'נסה שוב';
    }
}
</script>
</body>
</html>
