<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הרשמה למשחק</title>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #0F172A;
            --surface: #1E293B;
            --surface2: #263348;
            --primary: #10B981;
            --primary-dim: rgba(16,185,129,0.15);
            --primary-border: rgba(16,185,129,0.35);
            --text: #F8FAFC;
            --muted: #94A3B8;
            --border: #334155;
            --danger: #EF4444;
            --danger-dim: rgba(239,68,68,0.12);
            --active-color: #10B981;
            --active-dim: rgba(16,185,129,0.12);
            --active-border: rgba(16,185,129,0.3);
            --new-color: #60A5FA;
            --new-dim: rgba(59,130,246,0.12);
            --new-border: rgba(59,130,246,0.3);
            --resident-color: #FCD34D;
            --resident-dim: rgba(252,211,77,0.12);
            --resident-border: rgba(252,211,77,0.3);
            --waiting-color: #F97316;
            --waiting-dim: rgba(249,115,22,0.12);
            --waiting-border: rgba(249,115,22,0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            padding-bottom: 40px;
        }

        .game-header {
            background: linear-gradient(135deg, #0a3d2e 0%, #0F172A 60%);
            border-bottom: 1px solid var(--border);
            padding: 20px 20px 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .group-name {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1.2;
        }

        .game-date-badge {
            background: var(--primary-dim);
            border: 1px solid var(--primary-border);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 800;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s, border-color 0.2s;
        }

        body.is-admin .game-date-badge { cursor: pointer; }
        body.is-admin .game-date-badge:hover { background: rgba(16,185,129,0.25); border-color: var(--primary); }

        .date-edit-wrap { display: none; align-items: center; gap: 6px; flex-shrink: 0; }
        .date-edit-wrap.visible { display: flex; }

        .date-edit-input {
            background: var(--bg); border: 1.5px solid var(--primary); border-radius: 10px;
            color: var(--text); font-family: 'Heebo', sans-serif; font-size: 0.82rem;
            font-weight: 700; padding: 5px 8px; outline: none; width: 120px;
        }
        .time-edit-input {
            background: var(--bg); border: 1.5px solid var(--primary); border-radius: 10px;
            color: var(--text); font-family: 'Heebo', sans-serif; font-size: 0.82rem;
            font-weight: 700; padding: 5px 8px; outline: none; width: 76px;
        }

        .edit-save-btn, .edit-cancel-btn {
            border: none; border-radius: 8px; padding: 5px 10px;
            font-family: 'Heebo', sans-serif; font-size: 0.8rem; font-weight: 900;
            cursor: pointer; transition: opacity 0.15s;
        }
        .edit-save-btn { background: var(--primary); color: #fff; }
        .edit-cancel-btn { background: var(--border); color: var(--muted); }
        .edit-save-btn:active, .edit-cancel-btn:active { opacity: 0.7; }

        .capacity-bar-wrap { display: flex; align-items: center; gap: 10px; }
        .capacity-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .capacity-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s ease; }
        .capacity-bar-fill.full { background: var(--waiting-color); }
        .capacity-text { font-size: 0.82rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
        .capacity-text span { color: var(--primary); }
        .capacity-text.full span { color: var(--waiting-color); }

        .notice-box-outer { margin: 16px 16px 0; position: relative; }
        .notice-box {
            background: rgba(16,185,129,0.06); border: 1px solid var(--primary-border);
            border-radius: 14px; padding: 14px 16px; font-size: 0.88rem;
            color: var(--muted); line-height: 1.55; white-space: pre-wrap;
        }
        .notice-edit-btn {
            display: none; position: absolute; top: 8px; left: 8px;
            background: rgba(16,185,129,0.15); border: 1px solid var(--primary-border);
            color: var(--primary); border-radius: 8px; padding: 3px 8px;
            font-size: 0.75rem; font-weight: 900; cursor: pointer; transition: background 0.15s;
        }
        .notice-edit-btn:active { background: rgba(16,185,129,0.3); }
        body.is-admin .notice-edit-btn { display: block; }

        .notice-edit-area {
            display: none; width: 100%; min-height: 80px; background: var(--bg);
            border: 1.5px solid var(--primary); border-radius: 12px; color: var(--text);
            font-family: 'Heebo', sans-serif; font-size: 0.88rem; padding: 12px 14px;
            outline: none; resize: vertical; line-height: 1.55;
        }
        .notice-edit-area.visible { display: block; }
        .notice-edit-actions { display: none; gap: 8px; margin-top: 8px; }
        .notice-edit-actions.visible { display: flex; }

        .container { max-width: 540px; margin: 0 auto; padding: 16px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: 1rem; font-weight: 900; color: var(--text);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }

        .search-wrap { position: relative; margin-bottom: 8px; }
        .search-input {
            width: 100%; padding: 14px 16px; background: var(--bg);
            border: 2px solid var(--border); border-radius: 12px; color: var(--text);
            font-family: 'Heebo', sans-serif; font-size: 1.05rem; font-weight: 500;
            outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .search-input:focus { border-color: var(--primary); }
        .search-input::placeholder { color: var(--muted); font-weight: 400; }

        .autocomplete-list {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden; display: none;
            margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .autocomplete-list.visible { display: block; }

        .autocomplete-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--border);
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:active, .autocomplete-item:hover { background: rgba(16,185,129,0.1); }
        .autocomplete-item.disabled { opacity: 0.45; cursor: default; pointer-events: none; }

        .ac-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0; overflow: hidden;
        }
        .ac-avatar img { width:100%; height:100%; object-fit:cover; }
        .ac-info { flex: 1; }
        .ac-name { font-weight: 800; font-size: 0.97rem; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
        .ac-name-text { letter-spacing: 0; word-spacing: 0; }

        .badge-active  { display:inline-flex; align-items:center; gap:3px; background:var(--active-dim);   color:var(--active-color);   border:1px solid var(--active-border);   padding:1px 7px; border-radius:6px; font-size:0.7rem; font-weight:800; letter-spacing:0.3px; }
        .badge-new     { display:inline-flex; align-items:center; gap:3px; background:var(--new-dim);      color:var(--new-color);      border:1px solid var(--new-border);      padding:1px 7px; border-radius:6px; font-size:0.7rem; font-weight:800; letter-spacing:0.3px; }
        .badge-resident{ display:inline-flex; align-items:center; gap:3px; background:var(--resident-dim); color:var(--resident-color); border:1px solid var(--resident-border); padding:1px 7px; border-radius:6px; font-size:0.7rem; font-weight:800; letter-spacing:0.3px; }

        .ac-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
        .ac-status { font-size: 0.75rem; font-weight: 800; color: var(--primary); }
        .ac-status.registered { color: var(--muted); }

        .register-btn {
            width: 100%; padding: 15px; background: var(--primary); color: white; border: none;
            border-radius: 12px; font-family: 'Heebo', sans-serif; font-size: 1.1rem;
            font-weight: 900; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .register-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
        .register-btn:not(:disabled):active { transform: scale(0.97); }

        .section-label {
            font-size: 0.78rem; font-weight: 900; color: var(--muted);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

        .players-list { display: flex; flex-direction: column; gap: 8px; }

        .player-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 11px 14px; animation: slideIn 0.25s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

        .player-row.waiting { border-color: var(--waiting-border); background: var(--waiting-dim); }

        .player-pos { font-size:0.8rem; font-weight:900; color:var(--muted); width:22px; text-align:center; flex-shrink:0; }
        .player-pos.confirmed { color: var(--primary); }
        .player-pos.waiting-pos { color: var(--waiting-color); }

        .player-avatar {
            width:36px; height:36px; border-radius:50%;
            background:rgba(255,255,255,0.05); border:2px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:16px; flex-shrink:0; overflow:hidden;
        }
        .player-avatar img { width:100%; height:100%; object-fit:cover; }

        .player-name-wrap { flex:1; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
        .player-name { font-weight:800; font-size:0.97rem; }
        .player-time { font-size:0.75rem; color:var(--muted); margin-right:auto; }
        .waiting-tag { font-size:0.72rem; font-weight:800; background:var(--waiting-dim); color:var(--waiting-color); border:1px solid var(--waiting-border); padding:1px 8px; border-radius:6px; }

        .empty-state { text-align:center; padding:30px 20px; color:var(--muted); }
        .empty-state .icon { font-size:2.5rem; margin-bottom:10px; }
        .empty-state p { font-size:0.9rem; }

        .closed-banner { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:16px; padding:30px 20px; text-align:center; margin:20px 0; }
        .closed-banner .icon { font-size:3rem; margin-bottom:12px; }
        .closed-banner h2 { font-size:1.4rem; font-weight:900; margin-bottom:8px; }
        .closed-banner p { color:var(--muted); font-size:0.9rem; }

        .toast {
            position:fixed; bottom:30px; left:50%;
            transform:translateX(-50%) translateY(80px);
            background:var(--surface2); border:1px solid var(--border);
            border-radius:12px; padding:12px 20px;
            font-weight:800; font-size:0.95rem; z-index:999;
            transition:transform 0.3s ease; white-space:nowrap;
            box-shadow:0 8px 24px rgba(0,0,0,0.5);
        }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.success { border-color:var(--primary-border); color:var(--primary); }
        .toast.error   { border-color:rgba(239,68,68,0.4); color:#F87171; }
        .toast.info    { border-color:rgba(99,102,241,0.4); color:#818CF8; }

        .loading-wrap { text-align:center; padding:60px 20px; color:var(--muted); }
        .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 16px; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .waiting-divider { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:0.75rem; font-weight:800; color:var(--waiting-color); }
        .waiting-divider::before,.waiting-divider::after { content:''; flex:1; height:1px; background:var(--waiting-border); }

        .cancelled-divider { display:flex; align-items:center; gap:10px; margin:12px 0 8px; font-size:0.75rem; font-weight:800; color:var(--danger); }
        .cancelled-divider::before,.cancelled-divider::after { content:''; flex:1; height:1px; background:rgba(239,68,68,0.3); }

        .player-row.cancelled { border-color:rgba(239,68,68,0.25); background:rgba(239,68,68,0.06); opacity:0.85; }
        .cancelled-tag { font-size:0.72rem; font-weight:800; background:rgba(239,68,68,0.12); color:#F87171; border:1px solid rgba(239,68,68,0.3); padding:1px 8px; border-radius:6px; }
        .cancel-time { font-size:0.72rem; color:#F87171; font-weight:700; white-space:nowrap; }

        .remove-btn {
            width:30px; height:30px; border-radius:8px; border:none;
            background:rgba(239,68,68,0.15); color:#F87171; font-size:1rem;
            cursor:pointer; display:none; align-items:center; justify-content:center;
            flex-shrink:0; transition:background 0.15s;
        }
        .remove-btn:active { background:rgba(239,68,68,0.35); }
        body.is-admin .remove-btn { display:flex; }

        .highlight { color: var(--primary); }

        .cancelled-card { display:none; }
        body.is-admin .cancelled-card { display:block; }

        /* ===== GENERATE TEAMS BTN ===== */
        .generate-teams-btn {
            display: none;
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #10B981, #059669);
            color: white; border: none; border-radius: 12px;
            font-family: 'Heebo', sans-serif;
            font-size: 1.1rem; font-weight: 900; cursor: pointer;
            transition: all 0.2s; margin-top: 12px;
            box-shadow: 0 4px 15px rgba(16,185,129,0.4);
            align-items: center; justify-content: center; gap: 8px;
        }
        body.is-admin .generate-teams-btn { display: flex; }
        .generate-teams-btn:active { transform: scale(0.97); }
        .generate-teams-btn:disabled { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; }

        /* ===== GENERATING OVERLAY ===== */
        .generating-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15,23,42,0.92); backdrop-filter: blur(6px);
            z-index: 2000; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
        }
        .generating-overlay.visible { display: flex; }
        .generating-spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(16,185,129,0.2);
            border-top-color: #10B981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generating-title { font-size: 1.3rem; font-weight: 900; color: #F8FAFC; }
        .generating-sub {
            font-size: 0.9rem; color: #94A3B8; font-weight: 700;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ===== MINI CARD MODAL ===== */
        #miniCardOverlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="game-header" id="gameHeader" style="display:none;">
    <div class="header-top">
        <div>
            <div class="group-name" id="groupNameEl">⚽ טוען...</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
            <button onclick="promptAdminLogin()" id="adminLoginBtn"
                style="background:transparent; border:1px solid var(--border); color:var(--muted);
                       border-radius:8px; padding:5px 10px; font-size:0.78rem; font-weight:800;
                       cursor:pointer; font-family:Heebo,sans-serif;">ניהול 🔒</button>
            <div class="game-date-badge" id="gameDateBadge" onclick="startDateEdit()" title="לחץ לעריכה">—</div>
            <div class="date-edit-wrap" id="dateEditWrap">
                <input type="date" id="dateEditInput" class="date-edit-input" />
                <input type="time" id="timeEditInput" class="time-edit-input" />
                <button class="edit-save-btn" onclick="saveDateEdit()">✓</button>
                <button class="edit-cancel-btn" onclick="cancelDateEdit()">✕</button>
            </div>
        </div>
    </div>
    <div class="capacity-bar-wrap">
        <div class="capacity-bar-bg">
            <div class="capacity-bar-fill" id="capacityFill" style="width:0%"></div>
        </div>
        <div class="capacity-text" id="capacityText"><span>0</span> / 0 שחקנים</div>
    </div>
</div>

<!-- MAIN -->
<div class="container">
    <div id="loadingView" class="loading-wrap">
        <div class="spinner"></div>
        <div>טוען פרטי משחק...</div>
    </div>

    <div id="closedView" style="display:none;">
        <div class="closed-banner">
            <div class="icon">🔒</div>
            <h2>ההרשמה סגורה</h2>
            <p>המשחק הזה כבר לא פתוח להרשמה.<br>פנה למנהל הקבוצה לפרטים.</p>
        </div>
    </div>

    <div id="mainView" style="display:none;">

        <!-- Notice box -->
        <div id="noticeBoxWrap" style="display:none; margin-top:16px;">
            <div class="notice-box-outer">
                <div class="notice-box" id="noticeBoxText"></div>
                <button class="notice-edit-btn" onclick="startNoticeEdit()">✏️ ערוך</button>
                <textarea class="notice-edit-area" id="noticeEditArea"></textarea>
                <div class="notice-edit-actions" id="noticeEditActions">
                    <button class="edit-save-btn" onclick="saveNoticeEdit()">שמור ✓</button>
                    <button class="edit-cancel-btn" onclick="cancelNoticeEdit()">ביטול</button>
                </div>
            </div>
        </div>

        <!-- Register Form -->
        <div class="card" style="margin-top:16px;">
            <div class="card-title">✍️ הרשמה למשחק</div>
            <div class="search-wrap">
                <input type="text" id="playerSearchInput" class="search-input"
                    placeholder="הקלד את שמך..." autocomplete="off"
                    oninput="onSearchInput()" onfocus="onSearchFocus()" />
            </div>
            <div class="autocomplete-list" id="autocompleteList"></div>
            <button class="register-btn" id="registerBtn" disabled onclick="registerPlayer()">
                הירשם למשחק ⚽
            </button>
        </div>

        <!-- Players List -->
        <div class="card" id="playersCard">
            <div class="card-title">👥 רשימת שחקנים</div>
            <div id="playersList">
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <p>עוד אף אחד לא נרשם.<br>היה הראשון!</p>
                </div>
            </div>
            <div id="cancelledSection" style="display:none; margin-top:8px;">
                <div class="cancelled-divider">ביטולים</div>
                <div id="cancelledList" class="players-list"></div>
            </div>
        </div>

        <!-- Generate Teams Button (admin only) -->
        <button class="generate-teams-btn" id="generateTeamsBtn" onclick="generateTeamsFromReg()">
            🔒 סגור הרשמה וצור קבוצות מאוזנות 🔥
        </button>

    </div>
</div>

<!-- Generating Overlay -->
<div class="generating-overlay" id="generatingOverlay">
    <div class="generating-spinner"></div>
    <div class="generating-title">⚽ יוצר קבוצות מאוזנות...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Mini Card Modal -->
<div id="miniCardOverlay" onclick="closeMiniCard()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div onclick="event.stopPropagation()"
        style="background:var(--surface); border:1px solid var(--border); border-radius:20px;
        width:100%; max-width:380px; padding:24px; position:relative; text-align:center;
        max-height:90vh; overflow-y:auto;">
        <button onclick="closeMiniCard()"
            style="position:absolute; top:12px; left:12px; background:rgba(255,255,255,0.1);
            border:none; color:white; width:28px; height:28px; border-radius:50%;
            cursor:pointer; font-weight:bold; font-size:0.9rem;">✕</button>
        <div id="miniCardContent"></div>
    </div>
</div>

<script>
// ========== Firebase ==========
const firebaseConfig = {
    apiKey: "AIzaSyABePxlQnnjbmFWIlzR91kuYZQkpVFuELY",
    authDomain: "soccer-b30a6.firebaseapp.com",
    projectId: "soccer-b30a6",
    storageBucket: "soccer-b30a6.firebasestorage.app",
    messagingSenderId: "295483280442",
    appId: "1:295483280442:web:0633390394600eb6357903"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ========== State ==========
const urlParams      = new URLSearchParams(window.location.search);
const groupId        = urlParams.get('group');
const registrationId = urlParams.get('reg');

let groupData     = null;
let allPlayers    = [];
let registrations = [];
let selectedPlayer = null;
let gameData      = null;
let maxPlayers    = 10;
let isAdmin       = false;
let cancelled     = [];
let historyCache  = [];
let customParams  = [];

// ========== Init ==========
window.onload = async () => {
    if (!groupId || !registrationId) { showClosed(); return; }

    try {
        const groupDoc = await db.collection('groups').doc(groupId).get();
        if (!groupDoc.exists) { showClosed(); return; }
        groupData = groupDoc.data();

        const settings = groupData.settings || {};
        maxPlayers = (settings.numTeams || 3) * (settings.playersPerTeam || 6);
        customParams = groupData.customParams || [];

        const regRef = db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId);
        const regDoc = await regRef.get();
        if (!regDoc.exists) { showClosed(); return; }
        gameData = regDoc.data();
        if (!gameData.open) { showClosed(); return; }

        // Check admin
        const sessionKey = `admin_${groupId}`;
        if (sessionStorage.getItem(sessionKey) === 'true') {
            isAdmin = true;
            document.body.classList.add("is-admin");
            const btn = document.getElementById('adminLoginBtn');
            if (btn) { btn.textContent='✅ מנהל'; btn.style.color='var(--primary)'; btn.style.borderColor='var(--primary-border)'; }
        } else if (urlParams.get("admin") === "1") {
            const pwd = prompt("סיסמת מנהל:");
            if (pwd === groupData.password) {
                isAdmin = true;
                document.body.classList.add("is-admin");
                sessionStorage.setItem(sessionKey, 'true');
            }
        }

        // Load players
        const playersSnap = await db.collection('groups').doc(groupId).collection('players').get();
        allPlayers = playersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Load history
        const historySnap = await db.collection('groups').doc(groupId).collection('history').get();
        historyCache = historySnap.docs.map(d => d.data());

        // Show UI
        document.getElementById('gameHeader').style.display = 'block';
        document.getElementById('groupNameEl').textContent = '⚽ ' + (groupData.name || 'קבוצה');
        updateDateBadge(gameData);

        if (isAdmin) {
            const btn = document.getElementById('adminLoginBtn');
            if (btn) { btn.textContent='✅ מנהל'; btn.style.color='var(--primary)'; btn.style.borderColor='var(--primary-border)'; }
        }

        if (gameData.noticeText) showNoticeBox(gameData.noticeText);

        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('mainView').style.display    = 'block';

        // Realtime: entries
        db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId)
            .collection('entries')
            .orderBy('registeredAt', 'asc')
            .onSnapshot(snap => {
                registrations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPlayersList();
                updateCapacityBar();
            });

        // Realtime: cancelled
        db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId)
            .collection('cancelled')
            .orderBy('cancelledAt', 'desc')
            .onSnapshot(snap => {
                cancelled = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCancelledList();
            });

    } catch (e) {
        console.error(e);
        showClosed();
    }
};

function showClosed() {
    document.getElementById('loadingView').style.display = 'none';
    document.getElementById('closedView').style.display  = 'block';
}

function showNoticeBox(text) {
    const wrap = document.getElementById('noticeBoxWrap');
    const box  = document.getElementById('noticeBoxText');
    if (!text || !text.trim()) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    box.textContent    = text;
}

// ========== Priority ==========
function getPriorityScore(entry) {
    if (entry.isMoshavResident || (entry.isActive && !entry.isNew)) return 1;
    if (entry.isActive && entry.isNew)   return 2;
    if (!entry.isActive && !entry.isNew) return 3;
    return 4;
}

function getEntryBadgesHTML(entry) {
    let b = '';
    if (entry.isActive)         b += `<span class="badge-active">✅ פעיל</span>`;
    if (entry.isNew)            b += `<span class="badge-new">🆕 חדש</span>`;
    if (entry.isMoshavResident) b += `<span class="badge-resident">🏠 תושב</span>`;
    return b;
}

// ========== Date Badge ==========
function updateDateBadge(data) {
    const badge = document.getElementById('gameDateBadge');
    if (data.gameDate && data.gameTime) badge.textContent = `📅 ${data.gameDate} • ${data.gameTime}`;
    else if (data.gameDate)             badge.textContent = `📅 ${data.gameDate}`;
    else                                badge.textContent = '📅 קבע תאריך';
    if (isAdmin) badge.title = '✏️ לחץ לעריכה';
}

// ========== Inline Date Edit ==========
function startDateEdit() {
    if (!isAdmin) return;
    const dateInput = document.getElementById('dateEditInput');
    const timeInput = document.getElementById('timeEditInput');
    if (gameData.gameDate) {
        try {
            let iso;
            if (gameData.gameDate.includes('/')) {
                const [d, m, y] = gameData.gameDate.split('/');
                iso = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
            } else { iso = gameData.gameDate; }
            dateInput.value = iso;
        } catch(e) { dateInput.value = ''; }
    } else { dateInput.value = ''; }
    timeInput.value = gameData.gameTime || '';
    document.getElementById('gameDateBadge').style.display = 'none';
    document.getElementById('dateEditWrap').classList.add('visible');
    dateInput.focus();
}

function cancelDateEdit() {
    document.getElementById('dateEditWrap').classList.remove('visible');
    document.getElementById('gameDateBadge').style.display = '';
}

async function saveDateEdit() {
    const rawDate = document.getElementById('dateEditInput').value;
    const rawTime = document.getElementById('timeEditInput').value;
    if (!rawDate) { showToast('יש לבחור תאריך', 'error'); return; }
    const [y, m, d] = rawDate.split('-');
    const displayDate = `${d}/${m}/${y}`;
    try {
        await db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId)
            .update({ gameDate: displayDate, gameTime: rawTime || '' });
        gameData.gameDate = displayDate;
        gameData.gameTime = rawTime || '';
        cancelDateEdit();
        updateDateBadge(gameData);
        showToast('התאריך עודכן ✅', 'success');
    } catch(e) { console.error(e); showToast('שגיאה בשמירה', 'error'); }
}

// ========== Inline Notice Edit ==========
function startNoticeEdit() {
    const area    = document.getElementById('noticeEditArea');
    const actions = document.getElementById('noticeEditActions');
    const box     = document.getElementById('noticeBoxText');
    const editBtn = document.querySelector('.notice-edit-btn');
    area.value = gameData.noticeText || '';
    box.style.display     = 'none';
    editBtn.style.display = 'none';
    area.classList.add('visible');
    actions.classList.add('visible');
    area.focus();
    area.setSelectionRange(area.value.length, area.value.length);
}

function cancelNoticeEdit() {
    const area    = document.getElementById('noticeEditArea');
    const actions = document.getElementById('noticeEditActions');
    const box     = document.getElementById('noticeBoxText');
    const editBtn = document.querySelector('.notice-edit-btn');
    area.classList.remove('visible');
    actions.classList.remove('visible');
    box.style.display     = '';
    editBtn.style.display = '';
}

async function saveNoticeEdit() {
    const newText = document.getElementById('noticeEditArea').value.trim();
    try {
        await db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId)
            .update({ noticeText: newText });
        gameData.noticeText = newText;
        cancelNoticeEdit();
        showNoticeBox(newText);
        showToast('ההודעה עודכנה ✅', 'success');
    } catch(e) { console.error(e); showToast('שגיאה בשמירה', 'error'); }
}

// ========== Capacity ==========
function updateCapacityBar() {
    const confirmed = registrations.filter(r => !r.isWaiting).length;
    const total     = registrations.length;
    const pct       = Math.min(100, (confirmed / maxPlayers) * 100);
    const fill = document.getElementById('capacityFill');
    const text = document.getElementById('capacityText');
    fill.style.width = pct + '%';
    if (confirmed >= maxPlayers) {
        fill.classList.add('full');
        text.classList.add('full');
        text.innerHTML = `<span>${confirmed}</span> / ${maxPlayers} (${total - confirmed} ממתינים)`;
    } else {
        fill.classList.remove('full');
        text.classList.remove('full');
        text.innerHTML = `<span>${confirmed}</span> / ${maxPlayers} שחקנים`;
    }
}

// ========== Autocomplete ==========
function onSearchInput() {
    selectedPlayer = null;
    document.getElementById('registerBtn').disabled = true;
    const q = document.getElementById('playerSearchInput').value.trim();
    if (q.length < 1) { hideAutocomplete(); return; }
    renderAutocomplete(allPlayers.filter(p => p.name && p.name.startsWith(q)), q);
}

function onSearchFocus() {
    const q = document.getElementById('playerSearchInput').value.trim();
    if (q.length >= 1) onSearchInput();
}

function renderAutocomplete(results, query) {
    const list = document.getElementById('autocompleteList');
    if (results.length === 0) {
        list.innerHTML = `<div class="autocomplete-item" style="color:var(--muted); cursor:default;">לא נמצאו שחקנים תואמים</div>`;
        list.classList.add('visible');
        return;
    }
    list.innerHTML = results.map(p => {
        const already = registrations.some(r => r.playerId === p.id);
        const idx = p.name.indexOf(query);
        const hl  = idx >= 0
            ? p.name.slice(0,idx) + `<span class="highlight">${p.name.slice(idx,idx+query.length)}</span>` + p.name.slice(idx+query.length)
            : p.name;
        const badges = getEntryBadgesHTML(p);
        const avatar = p.imgUrl ? `<div class="ac-avatar"><img src="${p.imgUrl}"></div>` : `<div class="ac-avatar">👤</div>`;
        const status = already ? `<span class="ac-status registered">כבר רשום</span>` : '';
        const scores = p.isGk ? `🧤 ${p.gkScore||5}` : `🛡️${p.defScore||5} 🎯${p.attScore||5}`;
        return `<div class="autocomplete-item ${already?'disabled':''}" onclick="selectPlayer('${p.id}')">
            ${avatar}
            <div class="ac-info">
                <div class="ac-name"><span class="ac-name-text">${hl}</span> ${badges} ${status}</div>
                <div class="ac-sub">${scores}</div>
            </div>
        </div>`;
    }).join('');
    list.classList.add('visible');
}

function hideAutocomplete() { document.getElementById('autocompleteList').classList.remove('visible'); }

function selectPlayer(playerId) {
    const p = allPlayers.find(x => x.id === playerId);
    if (!p) return;
    selectedPlayer = p;
    document.getElementById('playerSearchInput').value = p.name;
    hideAutocomplete();
    document.getElementById('registerBtn').disabled = false;
}

document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap') && !e.target.closest('.autocomplete-list')) hideAutocomplete();
});

// ========== Register ==========
// FIX: Using selectedPlayer.id as the document ID prevents duplicate registrations.
// If the same player is registered twice (race condition or manual duplicate),
// the second set() will simply overwrite the first — no duplicate entries possible.
async function registerPlayer() {
    if (!selectedPlayer) return;
    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = 'רושם... ⏳';

    try {
        if (registrations.some(r => r.playerId === selectedPlayer.id)) {
            showToast('כבר רשום למשחק זה!', 'info');
            btn.textContent = 'הירשם למשחק ⚽';
            btn.disabled = false;
            return;
        }

        const confirmedCount  = registrations.filter(r => !r.isWaiting).length;
        const isFullBeforeAdd = confirmedCount >= maxPlayers;

        const isWithin4Hours = (() => {
            if (!gameData.gameDate || !gameData.gameTime) return false;
            try {
                let gameDateTime;
                if (gameData.gameDate.includes('/')) {
                    const [d,m,y] = gameData.gameDate.split('/');
                    gameDateTime = new Date(`${y}-${m}-${d}T${gameData.gameTime}:00`);
                } else {
                    gameDateTime = new Date(`${gameData.gameDate}T${gameData.gameTime}:00`);
                }
                const diffMs = gameDateTime - new Date();
                return diffMs >= 0 && diffMs <= 4*60*60*1000;
            } catch(e) { return false; }
        })();

        // FIX: store worst.playerId instead of worst.id (document ID)
        let bumpedPlayerDocId = null;
        if (isFullBeforeAdd && !isWithin4Hours) {
            const newPriority = getPriorityScore(selectedPlayer);
            const worst = registrations.filter(r => !r.isWaiting)
                .sort((a,b) => {
                    const pa=getPriorityScore(a), pb=getPriorityScore(b);
                    if (pb!==pa) return pb-pa;
                    const ta=a.registeredAt?.toMillis?a.registeredAt.toMillis():0;
                    const tb=b.registeredAt?.toMillis?b.registeredAt.toMillis():0;
                    return tb-ta;
                })[0];
            // FIX: use worst.playerId as the document ID
            if (worst && getPriorityScore(worst) > newPriority) bumpedPlayerDocId = worst.playerId;
        }

        const isWaiting = isFullBeforeAdd && !bumpedPlayerDocId;
        const batch = db.batch();
        const entriesRef = db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId).collection('entries');

        // FIX: use selectedPlayer.id as document ID — prevents duplicates
        batch.set(entriesRef.doc(selectedPlayer.id), {
            playerId: selectedPlayer.id,
            name: selectedPlayer.name,
            imgUrl: selectedPlayer.imgUrl || null,
            isActive: !!selectedPlayer.isActive,
            isNew: !!selectedPlayer.isNew,
            isMoshavResident: !!selectedPlayer.isMoshavResident,
            isGk: !!selectedPlayer.isGk,
            attScore: selectedPlayer.attScore || 5,
            defScore: selectedPlayer.defScore || 5,
            gkScore: selectedPlayer.gkScore || 5,
            isWaiting,
            registeredAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // FIX: use playerId as document ID for bump update
        if (bumpedPlayerDocId) batch.update(entriesRef.doc(bumpedPlayerDocId), { isWaiting: true });
        await batch.commit();

        try {
            await db.collection('groups').doc(groupId)
                .collection('players').doc(selectedPlayer.id)
                .update({ registrationCount: firebase.firestore.FieldValue.increment(1) });
        } catch(e) { console.warn('registrationCount update failed:', e); }

        document.getElementById('playerSearchInput').value = '';
        selectedPlayer = null;
        btn.textContent = 'הירשם למשחק ⚽';

        if (isWaiting)              showToast('נרשמת לרשימת המתנה ⏳', 'info');
        else if (bumpedPlayerDocId) showToast('נרשמת! שחקן אחר עבר להמתנה ✅', 'success');
        else                        showToast('נרשמת בהצלחה! ✅', 'success');

    } catch(e) {
        console.error(e);
        showToast('שגיאה ברישום, נסה שוב', 'error');
        btn.textContent = 'הירשם למשחק ⚽';
        btn.disabled = false;
    }
}

// ========== Render Players ==========
function renderPlayersList() {
    const container = document.getElementById('playersList');
    if (registrations.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>עוד אף אחד לא נרשם.<br>היה הראשון!</p></div>`;
        return;
    }

    const confirmed = registrations.filter(r=>!r.isWaiting)
        .sort((a,b)=>{ const pa=getPriorityScore(a),pb=getPriorityScore(b); if(pa!==pb)return pa-pb; return (a.registeredAt?.toMillis?a.registeredAt.toMillis():0)-(b.registeredAt?.toMillis?b.registeredAt.toMillis():0); });

    const waiting = registrations.filter(r=>r.isWaiting)
        .sort((a,b)=>{ const pa=getPriorityScore(a),pb=getPriorityScore(b); if(pa!==pb)return pa-pb; return (a.registeredAt?.toMillis?a.registeredAt.toMillis():0)-(b.registeredAt?.toMillis?b.registeredAt.toMillis():0); });

    let html = '';
    if (confirmed.length > 0) {
        html += `<div class="section-label">מאושרים (${confirmed.length}/${maxPlayers})</div><div class="players-list">`;
        confirmed.forEach((r,i) => { html += renderPlayerRow(r, i+1, false); });
        html += '</div>';
    }
    if (waiting.length > 0) {
        html += `<div class="waiting-divider">המתנה (${waiting.length})</div><div class="players-list">`;
        waiting.forEach((r,i) => { html += renderPlayerRow(r, i+1, true); });
        html += '</div>';
    }
    container.innerHTML = html;
}

function renderPlayerRow(r, pos, isWaiting) {
    const avatar = r.imgUrl
        ? `<div class="player-avatar" onclick="showMiniCard('${r.playerId}')" style="cursor:pointer;"><img src="${r.imgUrl}"></div>`
        : `<div class="player-avatar" onclick="showMiniCard('${r.playerId}')" style="cursor:pointer;">👤</div>`;
    const badges  = getEntryBadgesHTML(r);
    const gkBadge = r.isGk ? `<span style="font-size:0.72rem;background:rgba(167,139,250,0.15);color:#A78BFA;border:1px solid rgba(167,139,250,0.3);padding:1px 7px;border-radius:6px;font-weight:800;">🧤 שוער</span>` : '';
    const timeStr = r.registeredAt?.toDate ? r.registeredAt.toDate().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
    const waitTag = isWaiting ? `<span class="waiting-tag">המתנה</span>` : '';

    // FIX: remove button now uses r.playerId (= document ID) instead of r.id
    return `<div class="player-row ${isWaiting?'waiting':''}">
        <div class="player-pos ${isWaiting?'waiting-pos':'confirmed'}">${isWaiting?'⏳':pos}</div>
        ${avatar}
        <div class="player-name-wrap">
            <span class="player-name">${r.name}</span>
            ${badges}${gkBadge}${waitTag}
        </div>
        ${timeStr?`<span class="player-time">${timeStr}</span>`:''}
        <button class="remove-btn" onclick="removePlayer('${r.playerId}')" title="הסר שחקן">✕</button>
    </div>`;
}

// ========== Remove Player ==========
// FIX: entryId is now the playerId (= document ID in entries collection)
async function removePlayer(entryId) {
    if (!isAdmin) return;
    if (!confirm('להסיר שחקן זה מהרשימה?')) return;

    const entriesRef   = db.collection('groups').doc(groupId).collection('registrations').doc(registrationId).collection('entries');
    const cancelledRef = db.collection('groups').doc(groupId).collection('registrations').doc(registrationId).collection('cancelled');

    try {
        // FIX: find by playerId since that's now the document ID
        const removedEntry = registrations.find(r => r.playerId === entryId);
        if (!removedEntry) return;
        const wasConfirmed = !removedEntry.isWaiting;
        const batch = db.batch();

        batch.set(cancelledRef.doc(), {
            playerId: removedEntry.playerId, name: removedEntry.name,
            imgUrl: removedEntry.imgUrl || null,
            isActive: !!removedEntry.isActive, isNew: !!removedEntry.isNew,
            isMoshavResident: !!removedEntry.isMoshavResident,
            wasConfirmed, registeredAt: removedEntry.registeredAt,
            cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // FIX: delete by playerId (document ID)
        batch.delete(entriesRef.doc(entryId));

        if (wasConfirmed) {
            const wl = registrations.filter(r=>r.isWaiting&&r.playerId!==entryId)
                .sort((a,b)=>{ const pa=getPriorityScore(a),pb=getPriorityScore(b); if(pa!==pb)return pa-pb; return (a.registeredAt?.toMillis?a.registeredAt.toMillis():0)-(b.registeredAt?.toMillis?b.registeredAt.toMillis():0); });
            // FIX: promote by playerId (document ID)
            if (wl.length>0) batch.update(entriesRef.doc(wl[0].playerId), {isWaiting:false});
        }

        await batch.commit();

        try {
            await db.collection('groups').doc(groupId)
                .collection('players').doc(removedEntry.playerId)
                .update({ registrationCount: firebase.firestore.FieldValue.increment(-1) });
        } catch(e) { console.warn('registrationCount decrement failed:', e); }

        showToast('השחקן הוסר ✅', 'success');
    } catch(e) {
        console.error(e);
        showToast('שגיאה בהסרה', 'error');
    }
}

// ========== Render Cancelled ==========
function renderCancelledList() {
    const section   = document.getElementById('cancelledSection');
    const container = document.getElementById('cancelledList');
    if (!section || !container) return;
    if (cancelled.length === 0) { section.style.display='none'; return; }

    section.style.display = 'block';
    container.innerHTML = cancelled.map(r => {
        const avatar  = r.imgUrl ? `<div class="player-avatar" style="border-color:rgba(239,68,68,0.3);"><img src="${r.imgUrl}"></div>` : `<div class="player-avatar" style="border-color:rgba(239,68,68,0.3);">👤</div>`;
        const badges  = getEntryBadgesHTML(r);
        const timeStr = r.cancelledAt?.toDate ? r.cancelledAt.toDate().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
        return `<div class="player-row cancelled">
            <div class="player-pos" style="color:#F87171;">✕</div>
            ${avatar}
            <div class="player-name-wrap">
                <span class="player-name" style="color:#F87171;">${r.name}</span>
                ${badges}<span class="cancelled-tag">בוטל</span>
            </div>
            ${timeStr?`<span class="cancel-time">${timeStr}</span>`:''}
        </div>`;
    }).join('');
}

// ========== Admin Login ==========
function promptAdminLogin() {
    if (isAdmin) { showToast('כבר מחובר כמנהל ✅','success'); return; }
    if (!groupData) return;
    const pwd = prompt('סיסמת מנהל:');
    if (pwd === groupData.password) {
        isAdmin = true;
        document.body.classList.add('is-admin');
        sessionStorage.setItem(`admin_${groupId}`, 'true');
        const btn = document.getElementById('adminLoginBtn');
        if (btn) { btn.textContent='✅ מנהל'; btn.style.color='var(--primary)'; btn.style.borderColor='var(--primary-border)'; }
        updateDateBadge(gameData);
        showToast('מחובר כמנהל ✅','success');
    } else if (pwd !== null) {
        showToast('סיסמה שגויה ❌','error');
    }
}

// ========== Toast ==========
function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ========== Generate Teams ==========
async function generateTeamsFromReg() {
    const confirmed = registrations.filter(r => !r.isWaiting);
    if (confirmed.length !== maxPlayers) {
        showToast(`צריך בדיוק ${maxPlayers} שחקנים (יש ${confirmed.length})`, 'error');
        return;
    }
    if (!confirm(`לסגור את ההרשמה וליצור קבוצות מ-${confirmed.length} שחקנים?`)) return;

    document.getElementById('generatingOverlay').classList.add('visible');
    const btn = document.getElementById('generateTeamsBtn');
    btn.disabled = true;

    try {
        const lineup = confirmed.map(r => {
            const full = allPlayers.find(p => p.id === r.playerId);
            return full || { id: r.playerId, name: r.name, attScore: r.attScore||5, defScore: r.defScore||5, gkScore: r.gkScore||5, isGk: !!r.isGk };
        });

        const numTeams      = groupData.settings?.numTeams      || 3;
        const playersPerTeam = groupData.settings?.playersPerTeam || 6;

        // Mark lineup in Firestore
        const playersRef = db.collection('groups').doc(groupId).collection('players');
        const batch1 = db.batch();
        allPlayers.forEach(p => batch1.update(playersRef.doc(p.id), { inLineup: false, goals: 0 }));
        await batch1.commit();

        const batch2 = db.batch();
        lineup.forEach(p => batch2.update(playersRef.doc(p.id), { inLineup: true }));
        await batch2.commit();

        await new Promise(resolve => setTimeout(resolve, 50));

        const gkPlayers    = lineup.filter(p => p.isGk);
        const fieldPlayers = lineup.filter(p => !p.isGk);

        let best = null, min = Infinity;
        for (let i = 0; i < 5000; i++) {
            const teams     = Array.from({ length: numTeams }, () => []);
            const tempGks   = [...gkPlayers].sort(() => 0.5 - Math.random());
            const tempField = [...fieldPlayers].sort(() => 0.5 - Math.random());
            const teamOrder = Array.from({ length: numTeams }, (_, i) => i).sort(() => 0.5 - Math.random());

            tempGks.forEach((gk, i) => teams[teamOrder[i]].push(gk));
            let fi = 0;
            for (let t = 0; t < numTeams; t++) {
                const slots = playersPerTeam - teams[t].length;
                for (let s = 0; s < slots; s++) {
                    if (fi < tempField.length) teams[t].push(tempField[fi++]);
                }
            }

            const attScores = teams.map(t => {
                const fp = t.filter(p => !p.isGk);
                return fp.length ? fp.reduce((s, p) => s + (p.attScore||5), 0) / fp.length : 5;
            });
            const defScores = teams.map(t => {
                const fp = t.filter(p => !p.isGk);
                return fp.length ? fp.reduce((s, p) => s + (p.defScore||5), 0) / fp.length : 5;
            });
            const diff = (Math.max(...attScores) - Math.min(...attScores)) +
                         (Math.max(...defScores) - Math.min(...defScores));
            if (diff < min) { min = diff; best = teams; }
        }

        const hasFixedGk = best.map(t => t.some(p => p.isGk));
        const gkIds = best.map((t, i) => {
            if (hasFixedGk[i]) return t.find(p => p.isGk).id;
            return [...t].sort((a,b) => ((a.attScore||5)+(a.defScore||5)) - ((b.attScore||5)+(b.defScore||5)))[0]?.id || null;
        });

        const gameRef  = db.collection('groups').doc(groupId).collection('game').doc('current');
        const gameData2 = {
            gkIds, hasFixedGk,
            teamWins: Array(numTeams).fill(0),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        best.forEach((teamArr, idx) => { gameData2[`team${idx+1}`] = teamArr; });
        await gameRef.set(gameData2);

        // ====== עדכון היסטוריית נוכחות ======
        const allGroupPlayers = await db.collection('groups').doc(groupId).collection('players').get();
        const registeredIds = new Set(registrations.map(r => r.playerId));
        const attendanceBatch = db.batch();
        allGroupPlayers.docs.forEach(doc => {
            const wasPresent = registeredIds.has(doc.id) && !cancelled.some(c => c.playerId === doc.id);
            const currentHistory = doc.data().attendanceHistory || [];
            const newHistory = [...currentHistory, wasPresent].slice(-8);
            attendanceBatch.update(doc.ref, { attendanceHistory: newHistory });
        });
        await attendanceBatch.commit();
        // =====================================

        // Close registration
        await db.collection('groups').doc(groupId)
            .collection('registrations').doc(registrationId)
            .update({ open: false });
        await db.collection('groups').doc(groupId)
            .update({ activeRegistrationId: firebase.firestore.FieldValue.delete() });

        // Redirect to index
        const indexUrl = window.location.pathname.replace('registration.html', 'index.html')
            + `?group=${groupId}`;
        window.location.href = indexUrl;

    } catch (e) {
        console.error(e);
        document.getElementById('generatingOverlay').classList.remove('visible');
        btn.disabled = false;
        showToast('שגיאה ביצירת הקבוצות: ' + e.message, 'error');
    }
}

// ========== Mini Card ==========
function calcAge(birthDateStr) {
    if (!birthDateStr) return null;
    const [y, m, d] = birthDateStr.split('-').map(Number);
    const today = new Date();
    let age = today.getFullYear() - y;
    const monthDiff = today.getMonth() + 1 - m;
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < d)) age--;
    return age;
}

function getColorStyles(val) {
    const v = val || 5;
    if (v < 5)   return { hex:'#EF4444', bg:'rgba(239,68,68,0.15)',   text:'#EF4444', border:'rgba(239,68,68,0.3)' };
    if (v < 7.5) return { hex:'#F59E0B', bg:'rgba(245,158,11,0.15)',  text:'#F59E0B', border:'rgba(245,158,11,0.3)' };
    if (v < 8.5) return { hex:'#10B981', bg:'rgba(16,185,129,0.15)',  text:'#10B981', border:'rgba(16,185,129,0.3)' };
    return           { hex:'#06B6D4', bg:'rgba(6,182,212,0.15)',   text:'#06B6D4', border:'rgba(6,182,212,0.3)' };
}

function showMiniCard(playerId) {
    const p = allPlayers.find(x => x.id === playerId);
    if (!p) return;

    const pHistory   = historyCache.filter(h => h.playerId === playerId);
    const totalWins  = pHistory.filter(h => h.type === 'win').length;
    const totalGoals = pHistory.filter(h => h.type === 'goal').length
        + pHistory.filter(h => h.type === 'goal_adjustment').reduce((sum,h) => sum + (h.count||0), 0);

    const isGk = !!p.isGk;
    const age  = calcAge(p.birthDate);

    const borderColor = isGk ? '#A78BFA' : getColorStyles((p.attScore||5 + p.defScore||5) / 2).hex;
    const avatar = p.imgUrl
        ? `<img src="${p.imgUrl}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid ${borderColor};margin:0 auto 15px;display:block;">`
        : `<div style="width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.05);border:4px solid #334155;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 15px;">${isGk?'🧤':'👤'}</div>`;

    const badges   = getEntryBadgesHTML(p);
    const gkBadge  = isGk ? `<span style="background:rgba(167,139,250,0.15);color:#A78BFA;border:1px solid rgba(167,139,250,0.35);padding:2px 8px;border-radius:6px;font-size:0.75rem;font-weight:800;">🧤 שוער</span>` : '';
    const ageBadge = age !== null ? `<span style="background:rgba(99,102,241,0.12);color:#A5B4FC;border:1px solid rgba(99,102,241,0.3);padding:3px 10px;border-radius:20px;font-size:0.82rem;font-weight:800;">🎂 גיל ${age}</span>` : '';

    const getBar = (label, val, color) => {
        const c = color || getColorStyles(val).hex;
        return `<div style="display:flex;align-items:center;margin-bottom:10px;font-size:0.9rem;text-align:right;">
            <div style="width:140px;color:#cbd5e1;font-weight:500;">${label}</div>
            <div style="flex:1;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin:0 10px;">
                <div style="width:${(val||5)*10}%;height:100%;background:${c};border-radius:4px;"></div>
            </div>
            <div style="width:30px;text-align:left;font-weight:800;font-size:1rem;color:${c};">${val||5}</div>
        </div>`;
    };

    let scoreBoxes = '';
    if (isGk) {
        const c = getColorStyles(p.gkScore||5);
        scoreBoxes = `<div style="display:flex;justify-content:center;margin-bottom:20px;">
            <div style="border:2px solid ${c.border};background:${c.bg};padding:10px 30px;border-radius:12px;text-align:center;">
                <div style="font-size:1.6rem;font-weight:900;color:${c.text};">${p.gkScore||5}</div>
                <div style="font-size:0.8rem;font-weight:800;color:${c.text};">🧤 ציון שוער</div>
            </div>
        </div>`;
    } else {
        const ac = getColorStyles(p.attScore||5), dc = getColorStyles(p.defScore||5);
        scoreBoxes = `<div style="display:flex;justify-content:center;gap:15px;margin-bottom:20px;">
            <div style="border:2px solid ${ac.border};background:${ac.bg};padding:10px 20px;border-radius:12px;text-align:center;width:45%;">
                <div style="font-size:1.6rem;font-weight:900;color:${ac.text};">${p.attScore||5}</div>
                <div style="font-size:0.8rem;font-weight:800;color:${ac.text};">🎯 התקפה</div>
            </div>
            <div style="border:2px solid ${dc.border};background:${dc.bg};padding:10px 20px;border-radius:12px;text-align:center;width:45%;">
                <div style="font-size:1.6rem;font-weight:900;color:${dc.text};">${p.defScore||5}</div>
                <div style="font-size:0.8rem;font-weight:800;color:${dc.text};">🛡️ הגנה</div>
            </div>
        </div>`;
    }

    let statsSection = '';
    if (isGk) {
        statsSection = `
            <div style="font-size:1rem;color:#A78BFA;border-bottom:1px solid #334155;padding-bottom:5px;margin:15px 0 12px;text-align:right;">🧤 מדדי שוער</div>
            ${getBar('זינוק',        p.gkDiv, '#A78BFA')}
            ${getBar('אחיזה בכדור', p.gkHan, '#A78BFA')}
            ${getBar('בעיטה והוצאה',p.gkKic, '#A78BFA')}
            ${getBar('מיקום בשער',  p.gkPos, '#A78BFA')}
            ${getBar('רפלקסים',     p.gkRef, '#A78BFA')}`;
    } else {
        const attCustom = customParams.filter(cp => cp.type === 'att');
        const defCustom = customParams.filter(cp => cp.type === 'def');
        statsSection = `
            <div style="font-size:1rem;color:#94A3B8;border-bottom:1px solid #334155;padding-bottom:5px;margin:15px 0 12px;text-align:right;">⚔️ מדדי התקפה</div>
            ${getBar('סיומת מול שער', p.fin)}
            ${getBar('דריבל ושליטה', p.dri)}
            ${getBar('מהירות וזריזות',p.pac)}
            ${getBar('ראיית משחק',   p.vis)}
            ${getBar('תנועה ללא כדור',p.pos)}
            ${attCustom.length > 0 ? `<div style="font-size:0.85rem;color:#F87171;border-bottom:1px solid #334155;padding-bottom:5px;margin:12px 0 10px;text-align:right;">⚔️ התקפה מותאמת</div>${attCustom.map(cp => getBar(cp.name, (p.customStats&&p.customStats[cp.id])||5)).join('')}` : ''}
            <div style="font-size:1rem;color:#94A3B8;border-bottom:1px solid #334155;padding-bottom:5px;margin:15px 0 12px;text-align:right;">🛡️ מדדי הגנה ופיזיות</div>
            ${getBar('חילוצי כדור',  p.tac)}
            ${getBar('קריאת משחק',   p.awa)}
            ${getBar('פיזיות ועוצמה',p.str)}
            ${getBar('כושר גופני',   p.sta)}
            ${getBar('יציאה מלחץ',   p.com)}
            ${defCustom.length > 0 ? `<div style="font-size:0.85rem;color:#60A5FA;border-bottom:1px solid #334155;padding-bottom:5px;margin:12px 0 10px;text-align:right;">🛡️ הגנה מותאמת</div>${defCustom.map(cp => getBar(cp.name, (p.customStats&&p.customStats[cp.id])||5)).join('')}` : ''}`;
    }

    document.getElementById('miniCardContent').innerHTML = `
        ${avatar}
        <div style="font-size:1.6rem;font-weight:900;margin-bottom:8px;">${p.name} ${gkBadge}</div>
        <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;">${badges}</div>
        <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;">${ageBadge}</div>
        <div style="display:flex;justify-content:center;gap:15px;margin-bottom:20px;">
            <div style="background:rgba(252,211,77,0.1);border:1px solid rgba(252,211,77,0.3);padding:10px 20px;border-radius:12px;text-align:center;width:45%;">
                <div style="font-size:1.6rem;font-weight:900;color:#FCD34D;">${totalGoals}</div>
                <div style="font-size:0.8rem;font-weight:800;color:#FCD34D;">⚽ גולי קריירה</div>
            </div>
            <div style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);padding:10px 20px;border-radius:12px;text-align:center;width:45%;">
                <div style="font-size:1.6rem;font-weight:900;color:#10B981;">${totalWins}</div>
                <div style="font-size:0.8rem;font-weight:800;color:#10B981;">🏆 ניצחונות</div>
            </div>
        </div>
        ${scoreBoxes}
        ${statsSection}`;

    document.getElementById('miniCardOverlay').style.display = 'flex';
}

function closeMiniCard() {
    document.getElementById('miniCardOverlay').style.display = 'none';
}
